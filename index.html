<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mixer Profesional Melomas</title>
  <style>
    :root { --primary: #00ADB5; --bg-main: #121212; --bg-panel: #1e1e24; --text-main: #eeeeee; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 15px; }
    .mixer-board { background: var(--bg-panel); padding: 20px; border-radius: 12px; max-width: 600px; margin: 0 auto; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    h2 { text-align: center; color: var(--primary); margin-top: 0; }
    select { width: 100%; padding: 12px; background: #2a2a35; color: white; border: 1px solid #444; border-radius: 6px; margin-bottom: 15px; }
    .controls { display: flex; gap: 10px; margin-bottom: 20px; }
    button { flex: 1; padding: 15px; background: var(--primary); border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; text-transform: uppercase; }
    button:disabled { background: #333; cursor: not-allowed; }
    .track { display: flex; align-items: center; justify-content: space-between; background: #2a2a35; padding: 10px; margin-bottom: 8px; border-radius: 6px; }
    .track span { font-size: 14px; font-weight: bold; width: 80px; }
    input[type=range] { width: 100px; }
    #status { text-align: center; font-size: 12px; color: var(--primary); margin-bottom: 10px; height: 15px; }
  </style>
</head>
<body>

  <div class="mixer-board">
    <h2>MIXER MELOMAS</h2>
    <select id="songSelector" onchange="initSong()">
      <option value="" disabled selected>-- Elige Canción --</option>
      <option value="invencible">Invencible</option>
      <option value="guapa">Guapa</option>
    </select>
    <div id="status">Selecciona una canción</div>
    <div class="controls">
      <button id="playBtn" onclick="togglePlay()" disabled>CARGANDO</button>
      <button id="resetBtn" onclick="stopAll()" disabled>REINICIAR</button>
    </div>
    <div id="canalesUI"></div>
  </div>

  <script>
    const tracks = ['click', 'drums', 'bass', 'guitar', 'piano', 'other', 'vocals'];
    const audios = {};
    let isPlaying = false;

    // Inicializar UI
    const cont = document.getElementById('canalesUI');
    tracks.forEach(id => {
      cont.innerHTML += `
        <div class="track">
          <span>${id.toUpperCase()}</span>
          <audio id="audio-${id}" preload="auto" playsinline></audio>
          <input type="range" min="0" max="1" step="0.1" value="1" oninput="audios['${id}'].volume = this.value">
        </div>
      `;
      audios[id] = document.getElementById('audio-' + id);
    });

    function initSong() {
      const song = document.getElementById('songSelector').value;
      const status = document.getElementById('status');
      const btn = document.getElementById('playBtn');
      
      status.innerText = "Cargando audio en memoria...";
      btn.disabled = true;
      let loadedCount = 0;

      tracks.forEach(id => {
        audios[id].src = `audio/${song}/${id}.mp3`;
        audios[id].load();
        audios[id].oncanplaythrough = () => {
          loadedCount++;
          if(loadedCount === tracks.length) {
            btn.disabled = false;
            btn.innerText = "▶ PLAY";
            status.innerText = "Listo para ensayar";
          }
        };
      });
    }

    function togglePlay() {
      const btn = document.getElementById('playBtn');
      if (!isPlaying) {
        // Disparo asíncrono con compensación de latencia
        tracks.forEach(id => {
          audios[id].currentTime = 0;
          audios[id].play().catch(e => console.error("Error al disparar:", id));
        });
        btn.innerText = "⏸ PAUSA";
      } else {
        tracks.forEach(id => audios[id].pause());
        btn.innerText = "▶ PLAY";
      }
      isPlaying = !isPlaying;
      document.getElementById('resetBtn').disabled = false;
    }

    function stopAll() {
      tracks.forEach(id => { audios[id].pause(); audios[id].currentTime = 0; });
      isPlaying = false;
      document.getElementById('playBtn').innerText = "▶ PLAY";
    }
  </script>
</body>
</html>
