<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mixer de Ensayos Melomas</title>
  <style>
    :root { --primary: #00ADB5; --primary-hover: #007F86; --bg-main: #121212; --bg-panel: #1e1e24; --bg-track: #2a2a35; --text-main: #eeeeee; --text-muted: #a0a0a0; --danger: #FF4C4C; --solo: #F39C12; }
    body { font-family: sans-serif; background: var(--bg-main); color: var(--text-main); padding: 20px; text-align: center; margin: 0; }
    .mixer-board { background: var(--bg-panel); padding: 20px; border-radius: 16px; max-width: 600px; margin: 0 auto; }
    select { background: #2a2a35; color: white; padding: 10px; width: 100%; border-radius: 8px; margin-bottom: 20px; }
    button { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
    .track { display: flex; align-items: center; justify-content: space-between; background: var(--bg-track); padding: 10px; margin-bottom: 8px; border-radius: 8px; }
    input[type=range] { cursor: pointer; }
  </style>
</head>
<body>

  <h2>🎧 Mixer Melomas</h2>
  <div class="mixer-board">
    <select id="songSelector" onchange="cargarCancion()">
      <option value="" disabled selected>-- Elige Canción --</option>
      <option value="invencible">Invencible</option>
      <option value="guapa">Guapa</option>
    </select>
    <div id="statusMonitor">Selecciona una pista para precargar.</div>
    <button id="masterPlay" onclick="togglePlay()" disabled>▶ PLAY</button>
    <div id="canalesUI"></div>
  </div>

  <script>
    const trackInfo = [
      { id: 'click', label: 'Click' }, { id: 'drums', label: 'Batería' },
      { id: 'bass', label: 'Bajo' }, { id: 'guitar', label: 'Guitarra' },
      { id: 'piano', label: 'Teclados' }, { id: 'other', label: 'Otros' }, { id: 'vocals', label: 'Voz' }
    ];

    let isPlaying = false;
    const audios = {};

    window.onload = function() {
      const contenedor = document.getElementById('canalesUI');
      trackInfo.forEach(t => {
        contenedor.innerHTML += `
          <div class="track">
            <span>${t.label}</span>
            <audio id="audio-${t.id}" preload="auto"></audio>
            <input type="range" id="vol-${t.id}" min="0" max="1" step="0.1" value="1" oninput="audios['${t.id}'].volume = this.value">
          </div>
        `;
        audios[t.id] = document.getElementById('audio-' + t.id);
      });
    };

    function cargarCancion() {
      const songId = document.getElementById('songSelector').value;
      document.getElementById('statusMonitor').innerText = "Cargando archivos...";
      trackInfo.forEach(t => {
        audios[t.id].src = `audio/${songId}/${t.id}.mp3`;
        audios[t.id].load(); 
      });
      document.getElementById('masterPlay').disabled = false;
      document.getElementById('statusMonitor').innerText = "Listo. Dale Play.";
    }

    function togglePlay() {
      if (!isPlaying) {
        // RUTINA DE SINCRONIZACIÓN FORZADA
        const startTime = Date.now() + 200; // Buffer de 200ms para asegurar el arranque
        trackInfo.forEach(t => {
          audios[t.id].currentTime = 0;
          // Disparamos el play en cada pista
          audios[t.id].play().catch(e => console.error("Error en " + t.id, e));
        });
        document.getElementById('masterPlay').innerText = "⏸ PAUSA";
      } else {
        trackInfo.forEach(t => audios[t.id].pause());
        document.getElementById('masterPlay').innerText = "▶ PLAY";
      }
      isPlaying = !isPlaying;
    }
  </script>
</body>
</html>
